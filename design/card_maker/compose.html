<!doctype html>
<!-- 새 복 상품 카드: .card 하나 = 이미지 하나. 이모지(.ill)와 리본 글자(.rib)만 바꾸고 compose.js 에 id/파일명을 추가하세요. --><html><head><meta charset="utf-8"><style>
@font-face { font-family: Jua; src: url(fonts/jua-korean-400-normal.woff2); }
html,body{margin:0;background:transparent}
.card{position:relative;width:472px;height:566px;background:url(card_bok_blank.png) no-repeat;margin-bottom:10px}
.ill{position:absolute;left:238px;top:205px;transform:translate(-50%,-50%);font-size:190px;line-height:1;
  filter:drop-shadow(0 14px 10px rgba(120,60,0,.35))}
.rib{position:absolute;left:0;right:0;top:352px;text-align:center;font-family:Jua;font-size:50px;color:#3b1f06;
  letter-spacing:1px;text-shadow:0 2px 0 #fff3b0}
.sp{position:absolute;color:#ffd84a;font-size:30px;text-shadow:0 0 10px #fff6c0}
</style></head><body>
<div class="card" id="c1"><div class="ill">🖱️</div><div class="rib">무선마우스</div>
  <span class="sp" style="left:95px;top:70px">✦</span><span class="sp" style="left:350px;top:95px;font-size:22px">✦</span><span class="sp" style="left:365px;top:260px;font-size:26px">✦</span><span class="sp" style="left:80px;top:250px;font-size:20px">✦</span></div>
<div class="card" id="c2"><div class="ill">🍭</div><div class="rib">츄파춥스</div>
  <span class="sp" style="left:95px;top:70px">✦</span><span class="sp" style="left:350px;top:95px;font-size:22px">✦</span><span class="sp" style="left:365px;top:260px;font-size:26px">✦</span><span class="sp" style="left:80px;top:250px;font-size:20px">✦</span></div>
</body></html>
